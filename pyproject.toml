[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-index"
version = "0.4.1"
description = "Index, search, and analyze your Claude Code sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Lee Fuhr", email = "hi@leefuhr.com"}
]
maintainers = [
    {name = "Syrunekai", email = "noreply@syrunekai.com"}
]
keywords = ["claude", "claude-code", "session", "search", "index", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
synthesis = ["anthropic>=0.30.0"]

[project.scripts]
sessions = "session_index.cli:main"
session-index = "session_index.indexer:main"
session-search = "session_index.search:main"
session-analyze = "session_index.analyzer:main"
session-topic-capture = "session_index.topic_capture:main"

[project.urls]
Homepage = "https://github.com/Syrunekai/claude-session-index"
Repository = "https://github.com/Syrunekai/claude-session-index"
Issues = "https://github.com/Syrunekai/claude-session-index/issues"
Upstream = "https://github.com/lee-fuhr/claude-session-index"

# Fork metadata. PEP 621 doesn't define a standard "this is a fork of" field,
# so we keep the lineage in a tool table. Anyone (humans, scripts, CI) can read
# it; setuptools and PyPI ignore it.
[tool.session-index]
fork-of = "lee-fuhr/claude-session-index"
forked-from-version = "0.3.1"

[tool.setuptools.packages.find]
include = ["session_index*"]

[tool.setuptools.package-data]
session_index = ["_skill/*.md"]
